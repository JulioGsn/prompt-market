<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura geral do Prompt Store</title>
  <desc id="desc">Fluxo do GitHub e GitHub Actions até a VPS, passando pelo registry, Caddy, aplicação Rails e SQLite, com monitoramento e backup externo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d65f3d"/></marker>
    <style>
      .bg { fill: #f5f1e8; }
      .title { fill: #17252c; font: 700 32px ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #5f7076; font: 16px ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #17252c; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #5f7076; font: 14px ui-sans-serif, system-ui, sans-serif; }
      .box { fill: #fffdf8; stroke: #cfc4b5; stroke-width: 2; }
      .dark { fill: #203a43; stroke: #203a43; }
      .dark-text { fill: #fffdf8; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
      .accent { fill: #f5ddd4; stroke: #d65f3d; stroke-width: 2; }
      .line { stroke: #d65f3d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #8a9a9e; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1400" height="720"/>
  <text class="title" x="70" y="70">Prompt Store · arquitetura geral</text>
  <text class="subtitle" x="70" y="102">Uma aplicação Rails monolítica, empacotada em Docker e publicada em uma VPS pequena.</text>

  <rect class="box" x="70" y="190" width="210" height="120" rx="16"/>
  <text class="label" x="175" y="235" text-anchor="middle">GitHub</text>
  <text class="small" x="175" y="262" text-anchor="middle">código e pull requests</text>
  <text class="small" x="175" y="285" text-anchor="middle">README, ADRs e testes</text>

  <rect class="accent" x="350" y="190" width="230" height="120" rx="16"/>
  <text class="label" x="465" y="235" text-anchor="middle">GitHub Actions</text>
  <text class="small" x="465" y="262" text-anchor="middle">testes · lint · segurança</text>
  <text class="small" x="465" y="285" text-anchor="middle">build da imagem Docker</text>

  <rect class="box" x="650" y="190" width="220" height="120" rx="16"/>
  <text class="label" x="760" y="235" text-anchor="middle">GHCR</text>
  <text class="small" x="760" y="262" text-anchor="middle">imagem versionada por SHA</text>
  <text class="small" x="760" y="285" text-anchor="middle">pacote privado</text>

  <rect class="dark" x="950" y="145" width="370" height="430" rx="20"/>
  <text class="dark-text" x="1135" y="190" text-anchor="middle">VPS Hetzner · 1 GB RAM</text>

  <rect class="box" x="990" y="220" width="290" height="78" rx="12"/>
  <text class="label" x="1135" y="252" text-anchor="middle">Caddy</text>
  <text class="small" x="1135" y="276" text-anchor="middle">HTTPS · reverse proxy</text>

  <rect class="accent" x="990" y="330" width="290" height="90" rx="12"/>
  <text class="label" x="1135" y="365" text-anchor="middle">Prompt Store Rails</text>
  <text class="small" x="1135" y="390" text-anchor="middle">Puma · Basic Auth · métricas</text>

  <rect class="box" x="990" y="455" width="290" height="78" rx="12"/>
  <text class="label" x="1135" y="487" text-anchor="middle">SQLite</text>
  <text class="small" x="1135" y="511" text-anchor="middle">volume persistente</text>

  <rect class="box" x="70" y="485" width="250" height="100" rx="16"/>
  <text class="label" x="195" y="525" text-anchor="middle">Monitor externo</text>
  <text class="small" x="195" y="552" text-anchor="middle">/health/live</text>

  <rect class="box" x="430" y="485" width="250" height="100" rx="16"/>
  <text class="label" x="555" y="525" text-anchor="middle">Backup externo</text>
  <text class="small" x="555" y="552" text-anchor="middle">cópia do SQLite</text>

  <path class="line" d="M280 250 H350"/>
  <path class="line" d="M580 250 H650"/>
  <path class="line" d="M870 250 H950"/>
  <path class="line" d="M1135 298 V330"/>
  <path class="line" d="M1135 420 V455"/>
  <path class="dashed" d="M320 535 H430"/>
  <path class="dashed" d="M680 535 H900 V495 H990"/>
  <text class="small" x="70" y="650">Linhas contínuas: entrega. Linhas tracejadas: operação e recuperação.</text>
</svg>
