<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline CI/CD do Prompt Store</title>
  <desc id="desc">Pipeline de pull request até deploy aprovado e smoke test em produção.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d65f3d"/></marker>
    <style>
      .bg { fill: #f5f1e8; }
      .title { fill: #17252c; font: 700 32px ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #5f7076; font: 16px ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #17252c; font: 700 17px ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #5f7076; font: 14px ui-sans-serif, system-ui, sans-serif; }
      .box { fill: #fffdf8; stroke: #cfc4b5; stroke-width: 2; }
      .accent { fill: #f5ddd4; stroke: #d65f3d; stroke-width: 2; }
      .green { fill: #e4f1e8; stroke: #4e8b61; stroke-width: 2; }
      .line { stroke: #d65f3d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1500" height="560"/>
  <text class="title" x="70" y="70">CI/CD · do commit ao servidor</text>
  <text class="subtitle" x="70" y="102">CI dá feedback rápido; CD publica uma imagem imutável após aprovação.</text>

  <rect class="box" x="70" y="190" width="180" height="120" rx="16"/>
  <text class="label" x="160" y="235" text-anchor="middle">Pull Request</text>
  <text class="small" x="160" y="263" text-anchor="middle">requisito + código</text>
  <text class="small" x="160" y="285" text-anchor="middle">revisão humana</text>

  <rect class="accent" x="310" y="170" width="230" height="160" rx="16"/>
  <text class="label" x="425" y="215" text-anchor="middle">CI</text>
  <text class="small" x="425" y="245" text-anchor="middle">testes Rails</text>
  <text class="small" x="425" y="267" text-anchor="middle">RuboCop</text>
  <text class="small" x="425" y="289" text-anchor="middle">Brakeman + audit</text>
  <text class="small" x="425" y="311" text-anchor="middle">Docker build</text>

  <rect class="box" x="600" y="190" width="190" height="120" rx="16"/>
  <text class="label" x="695" y="235" text-anchor="middle">Main</text>
  <text class="small" x="695" y="263" text-anchor="middle">merge aprovado</text>
  <text class="small" x="695" y="285" text-anchor="middle">commit versionado</text>

  <rect class="accent" x="850" y="170" width="230" height="160" rx="16"/>
  <text class="label" x="965" y="215" text-anchor="middle">Build &amp; Publish</text>
  <text class="small" x="965" y="245" text-anchor="middle">imagem multi-stage</text>
  <text class="small" x="965" y="267" text-anchor="middle">tag: SHA do commit</text>
  <text class="small" x="965" y="289" text-anchor="middle">push para GHCR</text>

  <rect class="box" x="1140" y="190" width="170" height="120" rx="16"/>
  <text class="label" x="1225" y="235" text-anchor="middle">Aprovação</text>
  <text class="small" x="1225" y="263" text-anchor="middle">GitHub Environment</text>
  <text class="small" x="1225" y="285" text-anchor="middle">produção</text>

  <rect class="green" x="1360" y="190" width="100" height="120" rx="16"/>
  <text class="label" x="1410" y="235" text-anchor="middle">Deploy</text>
  <text class="small" x="1410" y="263" text-anchor="middle">SSH</text>
  <text class="small" x="1410" y="285" text-anchor="middle">smoke</text>

  <path class="line" d="M250 250 H310"/>
  <path class="line" d="M540 250 H600"/>
  <path class="line" d="M790 250 H850"/>
  <path class="line" d="M1080 250 H1140"/>
  <path class="line" d="M1310 250 H1360"/>
  <text class="small" x="70" y="440">Se o health check falhar, o deploy para e a versão anterior permanece disponível para rollback.</text>
</svg>
